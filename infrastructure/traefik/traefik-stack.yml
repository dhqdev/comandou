# Traefik para o PedeMais, instalado por scripts/install.sh quando o servidor ainda não tem um.
# Portas 80/443 no próprio host, certificados Let's Encrypt por HTTP-01 (um por endereço) e
# provider HTTP que lê os domínios próprios dos restaurantes direto da API.
# A configuração estática (com o token do provider) vem do secret pedemais_traefik_static,
# gerado pelo instalador. Se o seu servidor já tem Traefik, NÃO use este arquivo.
version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    command: ['--configFile=/etc/traefik/traefik.yml']
    ports:
      - { target: 80, published: 80, mode: host }
      - { target: 443, published: 443, mode: host }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    secrets:
      - source: pedemais_traefik_static
        target: /etc/traefik/traefik.yml
    networks: [network_public]
    deploy:
      mode: global
      placement:
        constraints: [node.role == manager]
      restart_policy: { condition: any }
      resources:
        limits: { memory: 256M }

networks:
  network_public:
    external: true

volumes:
  traefik_letsencrypt:

secrets:
  pedemais_traefik_static: { external: true }
