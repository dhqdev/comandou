# Stack de PRODUÇÃO para Docker Swarm / Portainer.
# Pré-requisitos (ver docs/deploy.md):
#   - Traefik existente no Swarm, conectado à rede externa `network_public`.
#   - Secrets criados (lista completa em docs/deploy.md#secrets).
#   - Certificado coringa (*.dominio, exige DNS-01): acrescente -c infrastructure/swarm/wildcard.yml.
#     Sem ele, cada endereço pede o próprio certificado (HTTP-01).
#   - Super Admin: PLATFORM_ADMIN_EMAIL (+ opcional PLATFORM_ADMIN_NAME) e os secrets
#     comandou_platform_admin_password / comandou_platform_admin_totp. Criado só se não houver nenhum.
#   - Variáveis: COMANDOU_VERSION (tag imutável), COMANDOU_BASE_DOMAIN (comandou.com),
#     TRAEFIK_ENTRYPOINT (ex.: websecure), TRAEFIK_CERT_RESOLVER (ex.: letsencryptresolver),
#     TRAEFIK_CUSTOM_CERT_RESOLVER (HTTP-01, domínios dos clientes). O bucket do backup é
#     configurado no painel Super Admin → Backups.
# Diferenças em relação ao docker-compose.yml de desenvolvimento:
#   - `build`, `depends_on` com condição e `container_name` não existem no Swarm.
#   - Labels do Traefik ficam em `deploy.labels` (não em `labels`).
#   - Migração roda como serviço one-shot (replicas 1, restart on-failure) ANTES de atualizar a API.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/comandou_pg_password
      COMANDOU_OWNER_PASSWORD_FILE: /run/secrets/comandou_owner_password
      COMANDOU_APP_PASSWORD_FILE: /run/secrets/comandou_app_password
      COMANDOU_PLATFORM_PASSWORD_FILE: /run/secrets/comandou_platform_password
    secrets:
      [
        comandou_pg_password,
        comandou_owner_password,
        comandou_app_password,
        comandou_platform_password,
      ]
    volumes:
      - comandou_pgdata:/var/lib/postgresql/data
    configs:
      - source: comandou_pg_init
        target: /docker-entrypoint-initdb.d/01-roles.sh
        mode: 0555
    networks: [comandou_internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 1G }

  # Filas (BullMQ) e eventos em tempo real entre as réplicas da API. Só na rede interna.
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - comandou_redisdata:/data
    networks: [comandou_internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 256M }

  # WhatsApp por QR Code (Baileys). Uma sessão por restaurante, cifrada no volume. Só na rede interna:
  # apenas a API fala com ele, com token próprio.
  whatsapp-gateway:
    image: ghcr.io/dhqdev/comandou-whatsapp-gateway:${COMANDOU_VERSION:?defina a versão}
    init: true
    environment:
      GATEWAY_TOKEN_FILE: /run/secrets/comandou_wa_gateway_token
      SESSION_KEY_FILE: /run/secrets/comandou_wa_session_key
      LOG_LEVEL: info
    secrets: [comandou_wa_gateway_token, comandou_wa_session_key]
    volumes:
      - comandou_wadata:/data
    networks: [comandou_internal, comandou_egress]
    deploy:
      replicas: 1 # uma conexão por número: nunca mais de uma réplica
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 384M }

  # Backup diário do banco central e do banco de cada restaurante (pg_dump, fotos incluídas),
  # cifrado com a INTEGRATIONS_KEY e enviado ao Backblaze B2 configurado no painel Super Admin →
  # Backups, numa pasta por restaurante (restaurantes/<endereço>/). Teste semanal de restauração
  # num Postgres temporário dentro do próprio contêiner. Também é ele que cria, muda e exclui os
  # bancos dos restaurantes pedidos no painel. A senha do postgres serve só para, ao iniciar,
  # dar ao papel dono a permissão de criar bancos (ALTER ROLE ... CREATEDB).
  backup:
    image: ghcr.io/dhqdev/comandou-backup:${COMANDOU_VERSION:?defina a versão}
    environment:
      DATABASE_OWNER_URL_FILE: /run/secrets/comandou_db_owner_url
      INTEGRATIONS_KEY_FILE: /run/secrets/comandou_integrations_key
      POSTGRES_PASSWORD_FILE: /run/secrets/comandou_pg_password
    secrets:
      - comandou_db_owner_url
      - comandou_integrations_key
      - comandou_pg_password
    networks: [comandou_internal, comandou_egress]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # o instalador roda o backup antes de atualizar
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 768M }

  migrate:
    image: ghcr.io/dhqdev/comandou-api:${COMANDOU_VERSION:?defina a versão}
    # Migra o banco, cria o Super Admin se ainda não existir nenhum (não altera um existente) e o
    # restaurante de demonstração "Casa Brasa" (exemplo.<domínio>), uma vez só, com ~30 dias de
    # pedidos, fotos e equipe. COMANDOU_DEMO=false desliga; reset recria do zero a cada subida.
    command:
      - sh
      - -c
      - node dist/database/migrate-cli.js && node dist/platform/platform-admin-cli.js --bootstrap && node dist/demo/demo-cli.js
    environment:
      COMANDOU_DEMO: ${COMANDOU_DEMO:-true}
      COMANDOU_DEMO_SLUG: ${COMANDOU_DEMO_SLUG:-exemplo}
      COMANDOU_BASE_DOMAIN: ${COMANDOU_BASE_DOMAIN:-comandou.com}
      DATABASE_OWNER_URL_FILE: /run/secrets/comandou_db_owner_url
      INTEGRATIONS_KEY_FILE: /run/secrets/comandou_integrations_key
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador}
      PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/comandou_platform_admin_password
      PLATFORM_ADMIN_TOTP_SECRET_FILE: /run/secrets/comandou_platform_admin_totp
    secrets:
      [
        comandou_db_owner_url,
        comandou_integrations_key,
        comandou_platform_admin_password,
        comandou_platform_admin_totp,
      ]
    networks: [comandou_internal]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, max_attempts: 5, delay: 10s }

  api:
    image: ghcr.io/dhqdev/comandou-api:${COMANDOU_VERSION:?defina a versão}
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/comandou_db_app_url
      COMANDOU_BASE_DOMAIN: ${COMANDOU_BASE_DOMAIN:-comandou.com}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'true'
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      # Chave (32 bytes base64) que cifra tokens da Focus NFe e do WhatsApp no banco.
      INTEGRATIONS_KEY_FILE: /run/secrets/comandou_integrations_key
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3100
      WHATSAPP_GATEWAY_TOKEN_FILE: /run/secrets/comandou_wa_gateway_token
      # Etapa 6: painel Super Admin (admin.comandou.com), métricas e domínios dos clientes.
      PLATFORM_DATABASE_URL_FILE: /run/secrets/comandou_db_platform_url
      METRICS_TOKEN_FILE: /run/secrets/comandou_metrics_token
      TRAEFIK_PROVIDER_TOKEN_FILE: /run/secrets/comandou_traefik_provider_token
      TRAEFIK_ENTRYPOINT: ${TRAEFIK_ENTRYPOINT:-websecure}
      TRAEFIK_CUSTOM_CERT_RESOLVER: ${TRAEFIK_CUSTOM_CERT_RESOLVER:-letsencrypt-http}
    secrets:
      - comandou_db_app_url
      - comandou_integrations_key
      - comandou_wa_gateway_token
      - comandou_db_platform_url
      - comandou_metrics_token
      - comandou_traefik_provider_token
    networks: [comandou_internal, network_public]
    deploy:
      replicas: 2
      update_config: { parallelism: 1, order: start-first, failure_action: rollback, delay: 10s }
      rollback_config: { parallelism: 1, order: start-first }
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 512M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.comandou-api.rule=HostRegexp(`^[a-z0-9-]+\.${COMANDOU_BASE_DOMAIN:-comandou.com}$$`) && PathPrefix(`/api`)
        - traefik.http.routers.comandou-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.comandou-api.tls=true
        - traefik.http.routers.comandou-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.routers.comandou-api.priority=100
        - traefik.http.services.comandou-api.loadbalancer.server.port=3000
        - traefik.http.services.comandou-api.loadbalancer.healthcheck.path=/api/v1/health/ready
        - traefik.http.services.comandou-api.loadbalancer.healthcheck.interval=10s

  web:
    image: ghcr.io/dhqdev/comandou-web:${COMANDOU_VERSION:?defina a versão}
    networks: [network_public]
    deploy:
      replicas: 2
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 128M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.comandou-web.rule=HostRegexp(`^[a-z0-9-]+\.${COMANDOU_BASE_DOMAIN:-comandou.com}$$`)
        - traefik.http.routers.comandou-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.comandou-web.tls=true
        - traefik.http.routers.comandou-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.routers.comandou-web.priority=10
        - traefik.http.services.comandou-web.loadbalancer.server.port=8080

networks:
  network_public:
    external: true # rede pública já existente do Traefik — NÃO criar outra
  comandou_internal:
    driver: overlay
    internal: true # Postgres sem acesso externo
  comandou_egress:
    driver: overlay # saída para a internet do gateway de WhatsApp (sem portas publicadas)

volumes:
  comandou_pgdata:
  comandou_redisdata:
  comandou_wadata:

configs:
  comandou_pg_init:
    file: ../docker/postgres-init/01-roles.sh

secrets:
  comandou_pg_password: { external: true }
  comandou_owner_password: { external: true }
  comandou_app_password: { external: true }
  comandou_db_app_url: { external: true }
  comandou_db_owner_url: { external: true }
  comandou_integrations_key: { external: true }
  comandou_wa_gateway_token: { external: true }
  comandou_wa_session_key: { external: true }
  comandou_platform_password: { external: true }
  comandou_db_platform_url: { external: true }
  comandou_metrics_token: { external: true }
  comandou_traefik_provider_token: { external: true }
  comandou_platform_admin_password: { external: true }
  comandou_platform_admin_totp: { external: true }
