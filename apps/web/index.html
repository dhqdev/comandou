<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Comandou — gestão completa para restaurantes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Comandou</title>
    <!-- Manifesto do app instalado conforme a tela (cardápio, entregador, painel). -->
    <script src="/app-manifest.js"></script>
    <!-- Tema salvo e a saída quando o app não abre (arquivo que não veio, rede ruim). -->
    <script src="/boot.js"></script>
    <!--
      Esqueleto da abertura: aparece já no primeiro byte, antes de qualquer arquivo do app, e some
      quando o React desenha a primeira tela. Cores iguais às de design-system/tokens.css.
    -->
    <style>
      .cm-boot {
        --b-bg: #f6f6f7;
        --b-frame: #ffffff;
        --b-bone: #ececef;
        --b-shine: #f6f6f8;
        --b-line: rgb(24 24 27 / 7%);
        --b-text: #18181b;
        --b-muted: #5b5b63;
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
        background: var(--b-bg);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        color: var(--b-text);
        animation: cm-boot-in 0.2s ease 0.15s both;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .cm-boot {
          --b-bg: #222a37;
          --b-frame: #1b2230;
          --b-bone: #2e3849;
          --b-shine: #36425a;
          --b-line: rgb(150 174 210 / 20%);
          --b-text: #f2f4f8;
          --b-muted: #b8c1cf;
        }
      }
      :root[data-theme='dark'] .cm-boot {
        --b-bg: #222a37;
        --b-frame: #1b2230;
        --b-bone: #2e3849;
        --b-shine: #36425a;
        --b-line: rgb(150 174 210 / 20%);
        --b-text: #f2f4f8;
        --b-muted: #b8c1cf;
      }
      /* Cardápio, links do cliente e site: sem menu lateral nem abas. */
      :root[data-boot='plain'] .cm-boot__side,
      :root[data-boot='plain'] .cm-boot__tabs {
        display: none;
      }
      :root[data-boot='plain'] .cm-boot {
        grid-template-columns: 1fr;
      }
      .cm-boot i {
        display: block;
        border-radius: 8px;
        background: var(--b-bone);
        background-image: linear-gradient(
          90deg,
          transparent 0,
          var(--b-shine) 50%,
          transparent 100%
        );
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: cm-boot-shine 1.4s ease-in-out infinite;
      }
      .cm-boot__top {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 56px;
        padding: env(safe-area-inset-top) 16px 0;
        background: var(--b-frame);
        border-bottom: 1px solid var(--b-line);
      }
      .cm-boot__side {
        display: none;
      }
      .cm-boot__main {
        display: grid;
        align-content: start;
        gap: 16px;
        padding: 20px 16px;
        overflow: hidden;
      }
      .cm-boot__cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .cm-boot__card {
        height: 84px;
        border-radius: 12px !important;
      }
      .cm-boot__list {
        display: grid;
        gap: 14px;
        padding: 16px;
        border-radius: 12px;
        background: var(--b-frame);
        border: 1px solid var(--b-line);
      }
      .cm-boot__row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .cm-boot__tabs {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 60px;
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--b-frame);
        border-top: 1px solid var(--b-line);
      }
      @media (min-width: 901px) {
        .cm-boot {
          grid-template-columns: 252px 1fr;
          grid-template-rows: auto 1fr;
        }
        .cm-boot__top {
          grid-column: 1 / -1;
        }
        .cm-boot__side {
          display: grid;
          align-content: start;
          gap: 14px;
          padding: 20px 16px;
          background: var(--b-frame);
        }
        .cm-boot__main {
          padding: 28px 32px;
        }
        .cm-boot__cards {
          grid-template-columns: repeat(4, 1fr);
        }
        .cm-boot__tabs {
          display: none;
        }
      }
      .cm-boot__msg {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(76px + env(safe-area-inset-bottom));
        max-width: 420px;
        margin: 0 auto;
        padding: 16px;
        border-radius: 14px;
        background: var(--b-frame);
        border: 1px solid var(--b-line);
        box-shadow: 0 12px 32px rgb(0 0 0 / 14%);
        font-size: 14px;
        line-height: 1.45;
      }
      .cm-boot__msg[hidden] {
        display: none;
      }
      .cm-boot__msg strong {
        display: block;
        margin-bottom: 4px;
        font-size: 15px;
      }
      .cm-boot__msg p {
        margin: 0 0 12px;
        color: var(--b-muted);
      }
      .cm-boot__msg button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: var(--b-text);
        color: var(--b-frame);
        font: inherit;
        font-weight: 600;
      }
      /*
       * Cardápio do cliente (/pedir): o esqueleto tem o formato da loja em cada tela (celular,
       * tablet e notebook), o mesmo que o React desenha (MenuSkeleton) até o cardápio chegar.
       * Assim a abertura passa direto do esqueleto para o cardápio, sem trocar de desenho.
       */
      .cm-msk {
        display: none;
      }
      /* O mesmo esqueleto desenhado pelo React: já está na tela, entra sem o esmaecer. */
      .cm-boot--react {
        display: block;
        overflow: hidden;
        animation: none;
      }
      .cm-boot--react i {
        animation-delay: var(--cm-sk-delay, 0s);
      }
      :root[data-boot='menu'] .cm-boot > :not(.cm-msk):not(.cm-boot__msg) {
        display: none;
      }
      :root[data-boot='menu'] .cm-boot {
        display: block;
        overflow: hidden;
      }
      :root[data-boot='menu'] .cm-msk,
      .cm-msk--react {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        align-content: start;
        min-height: 100%;
      }
      .cm-msk__side,
      .cm-msk__bar,
      .cm-msk__rail,
      .cm-msk__cart {
        display: none !important;
      }
      .cm-msk__main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-width: 0;
        padding-bottom: 80px;
      }
      .cm-msk__main > * {
        flex: none;
        margin: 0 16px;
      }
      /* Topo do app: saudação e pontos, o sino, a loja e a faixa do horário. */
      .cm-msk__hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 116px;
        align-items: center;
        gap: 12px;
        padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
      }
      .cm-msk__hello {
        display: grid;
        gap: 9px;
      }
      .cm-msk__name {
        width: 52%;
        height: 22px;
      }
      .cm-msk__status {
        width: 38%;
        height: 14px;
      }
      /* Celular: o selo "Aberta" no canto e nada de busca nem faixa do horário. */
      .cm-msk__info {
        width: 116px;
        height: 44px;
        border-radius: 999px !important;
      }
      .cm-msk__store {
        grid-column: 1 / -1;
        height: 62px;
        border-radius: 16px !important;
      }
      .cm-msk__ride {
        grid-column: 1 / -1;
        height: 40px;
        border-radius: 999px !important;
      }
      .cm-msk__search,
      .cm-msk__ride {
        display: none !important;
      }
      .cm-msk__search i:first-child {
        flex: 1;
        height: 46px;
        border-radius: 999px;
      }
      .cm-msk__search i:last-child {
        width: 46px;
        height: 46px;
        border-radius: 50%;
      }
      /* Grupos em quadradinhos, quatro por linha. */
      .cm-msk__chips {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }
      .cm-msk__chips span {
        display: grid;
        justify-items: center;
        gap: 8px;
      }
      .cm-msk__chips span i:first-child {
        width: 100%;
        max-width: 80px;
        aspect-ratio: 1;
        border-radius: 16px;
      }
      .cm-msk__chips span i:last-child {
        width: 70%;
        height: 10px;
      }
      .cm-msk__banner {
        height: 179px;
        border-radius: 12px !important;
      }
      .cm-msk__title {
        width: 120px;
        height: 18px;
        margin-top: 6px !important;
      }
      .cm-msk__grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .cm-msk__card {
        display: grid;
        gap: 10px;
        padding: 7px 7px 14px;
        border-radius: 16px;
        background: var(--b-frame);
      }
      .cm-msk__card i:first-child {
        height: 120px;
        border-radius: 9px;
      }
      .cm-msk__card i:nth-child(2) {
        width: 80%;
        height: 12px;
      }
      .cm-msk__card i:nth-child(3) {
        width: 45%;
        height: 14px;
      }
      .cm-msk__card:nth-child(n + 5) {
        display: none;
      }
      .cm-msk__tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 60px;
        padding-bottom: env(safe-area-inset-bottom);
        background: var(--b-frame);
        border-top: 1px solid var(--b-line);
      }
      .cm-msk__tabs span {
        display: grid;
        justify-items: center;
        gap: 6px;
      }
      .cm-msk__tabs span i:first-child {
        width: 24px;
        height: 22px;
        border-radius: 7px;
      }
      .cm-msk__tabs span i:last-child {
        width: 44px;
        height: 9px;
      }
      /* Tablet (700–1099px): barra no topo, categorias numa coluna e o topo do app em duas colunas. */
      @media (min-width: 700px) {
        :root[data-boot='menu'] .cm-msk,
        .cm-msk--react {
          grid-template-columns: 108px minmax(0, 1fr);
          grid-template-rows: 64px 1fr;
        }
        .cm-msk__bar {
          display: flex !important;
          grid-column: 1 / -1;
          align-items: center;
          gap: 10px;
          padding: 0 16px;
          background: var(--b-frame);
          border-bottom: 1px solid var(--b-line);
        }
        .cm-msk__rail {
          display: grid !important;
          align-content: start;
          justify-items: center;
          gap: 43px;
          padding-top: 22px;
          background: var(--b-frame);
        }
        .cm-msk__main {
          padding: 16px 20px 32px;
        }
        .cm-msk__main > * {
          margin: 0;
        }
        .cm-msk__hero {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
          gap: 12px 16px;
          padding-top: 4px;
        }
        .cm-msk__info {
          justify-self: end;
          width: 44px;
          border-radius: 50% !important;
        }
        .cm-msk__search {
          display: flex !important;
          gap: 10px;
        }
        .cm-msk__ride {
          display: block !important;
        }
        .cm-msk__hello .cm-msk__name {
          width: 40%;
          height: 26px;
        }
        .cm-msk__store,
        .cm-msk__ride {
          grid-column: auto;
          height: 60px;
          border-radius: 16px !important;
        }
        .cm-msk__chips,
        .cm-msk__tabs {
          display: none !important;
        }
        .cm-msk__banner {
          height: 168px;
          border-radius: 16px !important;
        }
        .cm-msk__grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 16px;
        }
        .cm-msk__card {
          padding: 7px 7px 16px;
        }
        .cm-msk__card i:first-child {
          height: 150px;
        }
        .cm-msk__card:nth-child(n + 4) {
          display: none;
        }
      }
      /* Notebook (1100px+): menu lateral com as categorias e, nas telas largas, a sacola ao lado. */
      @media (min-width: 1100px) {
        :root[data-boot='menu'] .cm-msk,
        .cm-msk--react {
          grid-template-columns: 256px minmax(0, 1fr);
          grid-template-rows: none;
          align-content: stretch;
          height: 100%;
        }
        .cm-msk__bar,
        .cm-msk__rail {
          display: none !important;
        }
        .cm-msk__side {
          display: grid !important;
          align-content: start;
          gap: 14px;
          padding: 20px 20px;
          background: var(--b-frame);
          border-right: 1px solid var(--b-line);
        }
        .cm-msk__main {
          padding: 20px 28px 32px;
        }
        .cm-msk__grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .cm-msk__card i:first-child {
          height: 128px;
        }
        .cm-msk__card:nth-child(4) {
          display: grid;
        }
      }
      @media (min-width: 1280px) {
        :root[data-boot='menu'] .cm-msk,
        .cm-msk--react {
          grid-template-columns: 256px minmax(0, 1fr) 340px;
        }
        .cm-msk__cart {
          display: grid !important;
          grid-template-rows: auto auto 1fr auto;
          gap: 14px;
          padding: 20px 18px;
          background: var(--b-frame);
          border-left: 1px solid var(--b-line);
        }
      }
      .cm-msk__row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cm-msk__lines {
        display: grid;
        flex: 1;
        gap: 7px;
      }
      @keyframes cm-boot-in {
        from {
          opacity: 0;
        }
      }
      @keyframes cm-boot-shine {
        from {
          background-position: 150% 0;
        }
        to {
          background-position: -50% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cm-boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o Comandou.</noscript>
    <div id="root">
      <div id="cm-boot" class="cm-boot" role="status" aria-busy="true" aria-label="Carregando">
        <div class="cm-boot__top">
          <i style="width: 32px; height: 32px; border-radius: 9px"></i>
          <i style="width: 120px; height: 14px"></i>
          <i style="width: 32px; height: 32px; border-radius: 50%; margin-left: auto"></i>
        </div>
        <div class="cm-boot__side">
          <i style="height: 14px; width: 70%"></i>
          <i style="height: 14px; width: 55%"></i>
          <i style="height: 14px; width: 64%"></i>
          <i style="height: 14px; width: 48%"></i>
          <i style="height: 14px; width: 60%"></i>
        </div>
        <div class="cm-boot__main">
          <i style="height: 22px; width: 180px"></i>
          <div class="cm-boot__cards">
            <i class="cm-boot__card"></i>
            <i class="cm-boot__card"></i>
            <i class="cm-boot__card"></i>
            <i class="cm-boot__card"></i>
          </div>
          <div class="cm-boot__list">
            <div class="cm-boot__row">
              <i style="width: 36px; height: 36px; border-radius: 50%"></i>
              <i style="height: 12px; flex: 1"></i>
              <i style="height: 12px; width: 56px"></i>
            </div>
            <div class="cm-boot__row">
              <i style="width: 36px; height: 36px; border-radius: 50%"></i>
              <i style="height: 12px; flex: 0.8"></i>
              <i style="height: 12px; width: 56px; margin-left: auto"></i>
            </div>
            <div class="cm-boot__row">
              <i style="width: 36px; height: 36px; border-radius: 50%"></i>
              <i style="height: 12px; flex: 0.6"></i>
              <i style="height: 12px; width: 56px; margin-left: auto"></i>
            </div>
          </div>
        </div>
        <div class="cm-boot__tabs">
          <i style="width: 28px; height: 28px; border-radius: 8px"></i>
          <i style="width: 28px; height: 28px; border-radius: 8px"></i>
          <i style="width: 28px; height: 28px; border-radius: 8px"></i>
          <i style="width: 28px; height: 28px; border-radius: 8px"></i>
        </div>
        <!-- Cardápio do cliente: o formato da loja (igual ao MenuSkeleton do React). -->
        <div class="cm-msk" aria-hidden="true">
          <div class="cm-msk__side">
            <div class="cm-msk__row">
              <i style="width: 44px; height: 44px; border-radius: 50%"></i>
              <span class="cm-msk__lines"
                ><i style="height: 13px; width: 80%"></i><i style="height: 10px; width: 50%"></i
              ></span>
            </div>
            <i style="height: 36px; margin-top: 4px"></i>
            <i style="height: 12px; width: 50%; margin-left: 12px"></i>
            <i style="height: 12px; width: 44%; margin-left: 12px"></i>
            <i style="height: 12px; width: 56%; margin-left: 12px"></i>
            <i style="height: 10px; width: 30%; margin-top: 18px"></i>
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 11px"></i
              ><i style="height: 12px; width: 55%"></i>
            </div>
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 11px"></i
              ><i style="height: 12px; width: 42%"></i>
            </div>
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 11px"></i
              ><i style="height: 12px; width: 50%"></i>
            </div>
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 11px"></i
              ><i style="height: 12px; width: 38%"></i>
            </div>
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 11px"></i
              ><i style="height: 12px; width: 46%"></i>
            </div>
          </div>
          <div class="cm-msk__bar">
            <i style="width: 40px; height: 40px; border-radius: 50%"></i>
            <span class="cm-msk__lines" style="flex: 0 0 150px"
              ><i style="height: 13px"></i><i style="height: 10px; width: 60%"></i
            ></span>
            <i style="width: 104px; height: 40px; border-radius: 999px; margin-left: auto"></i>
            <i style="width: 28px; height: 28px; border-radius: 50%"></i>
            <i style="width: 28px; height: 28px; border-radius: 50%"></i>
            <i style="width: 28px; height: 28px; border-radius: 50%"></i>
            <i style="width: 112px; height: 46px; border-radius: 999px; margin-left: 8px"></i>
          </div>
          <div class="cm-msk__rail">
            <i style="width: 60px; height: 60px; border-radius: 18px"></i>
            <i style="width: 60px; height: 60px; border-radius: 18px"></i>
            <i style="width: 60px; height: 60px; border-radius: 18px"></i>
            <i style="width: 60px; height: 60px; border-radius: 18px"></i>
            <i style="width: 60px; height: 60px; border-radius: 18px"></i>
          </div>
          <div class="cm-msk__main">
            <div class="cm-msk__hero">
              <span class="cm-msk__hello"
                ><i class="cm-msk__name"></i><i class="cm-msk__status"></i
              ></span>
              <i class="cm-msk__info"></i>
              <i class="cm-msk__store"></i>
              <i class="cm-msk__ride"></i>
            </div>
            <div class="cm-msk__search"><i></i><i></i></div>
            <i class="cm-msk__banner"></i>
            <div class="cm-msk__chips">
              <span><i></i><i></i></span><span><i></i><i></i></span><span><i></i><i></i></span
              ><span><i></i><i></i></span>
            </div>
            <i class="cm-msk__title"></i>
            <div class="cm-msk__grid">
              <div class="cm-msk__card"><i></i><i></i><i></i></div>
              <div class="cm-msk__card"><i></i><i></i><i></i></div>
              <div class="cm-msk__card"><i></i><i></i><i></i></div>
              <div class="cm-msk__card"><i></i><i></i><i></i></div>
            </div>
          </div>
          <div class="cm-msk__cart">
            <div class="cm-msk__row">
              <i style="width: 36px; height: 36px; border-radius: 50%"></i
              ><i style="height: 16px; width: 40%"></i>
            </div>
            <i style="height: 38px; border-radius: 8px"></i>
            <span></span>
            <i style="height: 50px; border-radius: 999px"></i>
          </div>
          <div class="cm-msk__tabs">
            <span><i></i><i></i></span><span><i></i><i></i></span><span><i></i><i></i></span
            ><span><i></i><i></i></span><span><i></i><i></i></span>
          </div>
        </div>
        <div id="cm-boot-msg" class="cm-boot__msg" role="alert" hidden>
          <strong id="cm-boot-title">Está demorando mais que o normal</strong>
          <p id="cm-boot-text">
            A internet pode estar lenta. Se não abrir, toque em Tentar de novo: o app baixa tudo
            outra vez, sem apagar os seus dados.
          </p>
          <button id="cm-boot-retry" type="button">Tentar de novo</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
