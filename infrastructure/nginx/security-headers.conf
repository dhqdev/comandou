# Repetido em cada location com add_header (Nginx não herda add_header quando a location define o seu).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=(self): o garçom e o Salão leem o QR Code da mesa pela câmera (QrScanner). Com camera=()
# o navegador recusava a câmera em produção (no Vite de desenvolvimento não há este cabeçalho).
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 'wasm-unsafe-eval', worker blob: e connect blob: vieram do item em 3D do cardápio (model-viewer),
# retirado por enquanto na 0.272; ficam para quando ele voltar.
# assets.pagseguro.com.br: SDK do PagBank que cifra o cartão no celular (pagamento pelo app).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://assets.pagseguro.com.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: wss: https://viacep.com.br https://brasilapi.com.br; media-src 'self' blob: data:; manifest-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
