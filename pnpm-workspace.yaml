packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
# Baileys aponta o libsignal para um git via SSH, que o CI não consegue clonar.
# Usamos o libsignal@6.0.0 do npm, publicado do mesmo commit (gitHead bcea72d).
overrides:
  libsignal: 6.0.0
  # GHSA-r3ph-w7gj-g6xm (vem pelo @nestjs/swagger).
  'js-yaml@>=5.0.0 <5.4.1': ^5.4.1
  # GHSA-27r3-jxmh-p828 e GHSA-q7qp-rjg7-q26m (vêm pelo @nestjs/platform-express).
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'multer@>=2.0.0 <2.5.0': ^2.5.0
  # GHSA-mrwp-f3q8-3g9p (vem pelo baileys > axios, no whatsapp-gateway).
  'follow-redirects@>=1.16.0 <1.16.2': ^1.16.2
  # Só de build (vite-plugin-pwa > workbox-build): GHSA-m5mm-p8h7-m29v, GHSA-3g3m-2fjr-6pw4 e
  # GHSA-g3hv-75wg-m249. Nenhuma vai para as imagens de produção, mas o build roda no CI.
  'serialize-javascript@<7.1.3': ^7.1.3
  'glob@>=9.0.0 <14.0.2': ^14.0.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
