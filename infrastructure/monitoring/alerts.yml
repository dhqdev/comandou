# Alertas do Comandou para o Prometheus. O alvo deve ter job="comandou-api" e coletar
# https://<qualquer restaurante>/api/v1/metrics com o token comandou_metrics_token.
# Testes: promtool test rules alerts.test.yml (rodam no CI).
groups:
  - name: comandou
    rules:
      - alert: ComandouApiFora
        expr: up{job="comandou-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'API do Comandou não responde às métricas'
          runbook: 'docs/operations.md#api-fora-do-ar'

      - alert: ComandouErros5xx
        expr: |
          sum(rate(comandou_http_server_errors_total[5m]))
            / clamp_min(sum(rate(comandou_http_request_duration_seconds_count[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: 'Mais de 2% das requisições com erro 5xx'
          runbook: 'docs/operations.md#erros-5xx'

      - alert: ComandouLento
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(comandou_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: '95% das requisições acima de 1 s'
          runbook: 'docs/operations.md#lentidao'

      - alert: ComandouPoolDoBancoEsperando
        expr: max(comandou_db_pool_connections{state="waiting"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Requisições esperando conexão com o banco'
          runbook: 'docs/operations.md#lentidao'

      - alert: ComandouFilaAcumulada
        expr: max(comandou_queue_jobs{state=~"waiting|delayed"}) > 200
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Fila de nota fiscal/WhatsApp acumulando'
          runbook: 'docs/operations.md#fila-acumulada'

      - alert: ComandouMemoriaAlta
        expr: max(comandou_process_resident_memory_bytes) > 450 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'API perto do limite de 512 MB de memória'
          runbook: 'docs/operations.md#lentidao'

      - alert: ComandouBackupAtrasado
        expr: time() - max(comandou_backup_last_success_timestamp_seconds{kind="backup"}) > 26 * 3600
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: 'Nenhum backup bem-sucedido nas últimas 26 h'
          runbook: 'docs/operations.md#backup-atrasado'

      - alert: ComandouTesteDeRestauracaoAtrasado
        expr: time() - max(comandou_backup_last_success_timestamp_seconds{kind="restore_test"}) > 8 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: 'Nenhum teste de restauração bem-sucedido em 8 dias'
          runbook: 'docs/operations.md#backup-atrasado'

  # Aplicativos de delivery (ADR 0015). "Polling parado" é o crítico: sem ele, pedido do iFood não
  # chega e o aplicativo cancela sozinho. Os demais avisam ANTES de chegar perto dos limites que
  # fazem o aplicativo bloquear o Comandou.
  - name: comandou-canais
    rules:
      - alert: ComandouAppPollingParado
        expr: |
          max by (channel) (comandou_channel_poll_stores) > 0
          and on (channel)
          (time() - max by (channel) (comandou_channel_poll_last_success_timestamp_seconds)) > 180
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Pedidos do {{ $labels.channel }} não estão sendo buscados há mais de 3 minutos'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppErrosNoEndpoint
        expr: |
          sum by (channel, endpoint) (rate(comandou_channel_requests_total{result!="2xx"}[10m]))
            / clamp_min(sum by (channel, endpoint) (rate(comandou_channel_requests_total[10m])), 1e-9)
            > 0.05
          and sum by (channel, endpoint) (rate(comandou_channel_requests_total[10m])) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Mais de 5% de erro em {{ $labels.channel }} {{ $labels.endpoint }}'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppPediuParaEsperar
        expr: sum by (channel, endpoint) (increase(comandou_channel_requests_total{result="429"}[10m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.channel }} respondeu 429 em {{ $labels.endpoint }} (perto do limite de chamadas)'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppAckAtrasado
        expr: |
          sum by (channel) (rate(comandou_channel_acks_total{result!="ok"}[10m]))
            / clamp_min(sum by (channel) (rate(comandou_channel_acks_total[10m])), 1e-9) > 0.1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Mais de 10% dos eventos do {{ $labels.channel }} sem ack (o aplicativo vai mandar de novo)'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppAcoesFalhando
        expr: sum by (channel) (increase(comandou_channel_outbox_total{result="failed"}[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Ações para o {{ $labels.channel }} falharam de vez (aparecem na tela do restaurante)'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppEventosFalhando
        expr: sum by (channel) (increase(comandou_channel_events_processed_total{result="failed"}[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Eventos do {{ $labels.channel }} não foram tratados (aparecem na tela do restaurante)'
          runbook: 'docs/operations.md#aplicativos-de-delivery'

      - alert: ComandouAppConsultasNoLimite
        expr: sum by (channel) (increase(comandou_channel_order_lookups_blocked_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'Pedido do {{ $labels.channel }} chegou ao limite de 10 consultas'
          runbook: 'docs/operations.md#aplicativos-de-delivery'
