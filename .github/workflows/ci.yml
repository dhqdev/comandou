name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Com Redis, os testes da nota fiscal e do WhatsApp passam pela fila real (BullMQ).
      TEST_REDIS_URL: redis://localhost:6379
      TEST_DATABASE_OWNER_URL: postgres://pedemais_owner:owner_ci@localhost:5432/pedemais_test
      TEST_DATABASE_URL: postgres://pedemais_app:app_ci@localhost:5432/pedemais_test
      TEST_DATABASE_PLATFORM_URL: postgres://pedemais_platform:platform_ci@localhost:5432/pedemais_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Papéis do banco de teste
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE pedemais_owner LOGIN PASSWORD 'owner_ci'" \
            -c "CREATE ROLE pedemais_app LOGIN PASSWORD 'app_ci' NOBYPASSRLS" \
            -c "CREATE ROLE pedemais_platform LOGIN PASSWORD 'platform_ci' NOBYPASSRLS" \
            -c "CREATE DATABASE pedemais_test OWNER pedemais_owner"
      - run: pnpm format:check
      - name: Scripts de shell
        run: shellcheck -x -S warning infrastructure/backup/*.sh scripts/*.sh
      - name: Alertas do Prometheus
        working-directory: infrastructure/monitoring
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.2 check rules alerts.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.2 test rules alerts.test.yml
      - run: pnpm --filter @pedemais/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: node --test tools/print-agent/escpos.test.mjs
      - run: pnpm build
      - name: Auditoria de dependências (alta/crítica)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: check
    env:
      # Valores só de teste (banco descartável do CI), nunca usados em produção.
      E2E_INTEGRATIONS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      E2E_ADMIN_PASSWORD: e2e-super-admin-123
      E2E_ADMIN_TOTP: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pedemais/web exec playwright install --with-deps chromium
      - name: Banco, migrações e tenant de teste
        env:
          PGPASSWORD: postgres
          DATABASE_OWNER_URL: postgres://pedemais_owner:owner_ci@localhost:5432/pedemais
          PROVISION_ADMIN_PASSWORD: e2e-senha-forte-123
          E2E_INTEGRATIONS_KEY: ${{ env.E2E_INTEGRATIONS_KEY }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP: ${{ env.E2E_ADMIN_TOTP }}
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE pedemais_owner LOGIN PASSWORD 'owner_ci'" \
            -c "CREATE ROLE pedemais_app LOGIN PASSWORD 'app_ci' NOBYPASSRLS" \
            -c "CREATE ROLE pedemais_platform LOGIN PASSWORD 'platform_ci' NOBYPASSRLS" \
            -c "CREATE DATABASE pedemais OWNER pedemais_owner"
          pnpm --filter @pedemais/shared build
          pnpm --filter @pedemais/api build
          pnpm --filter @pedemais/api db:migrate
          pnpm --filter @pedemais/api tenant:provision demo "Restaurante Demo" dono@demo.local "Dono Demo"
          # Super Admin de teste com segredo TOTP fixo (o teste do navegador gera o código).
          DATABASE_OWNER_URL=$DATABASE_OWNER_URL INTEGRATIONS_KEY=$E2E_INTEGRATIONS_KEY \
            PLATFORM_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD PLATFORM_ADMIN_TOTP_SECRET=$E2E_ADMIN_TOTP \
            node apps/api/dist/platform/platform-admin-cli.js admin@e2e.local "Admin E2E"
      - name: Subir API e Web
        run: |
          DATABASE_URL=postgres://pedemais_app:app_ci@localhost:5432/pedemais AUTH_LOGIN_RATE_LIMIT=100 \
            PLATFORM_DATABASE_URL=postgres://pedemais_platform:platform_ci@localhost:5432/pedemais \
            INTEGRATIONS_KEY=$E2E_INTEGRATIONS_KEY \
            nohup node apps/api/dist/main.js > api.log 2>&1 &
          nohup pnpm --filter @pedemais/web exec vite --port 5173 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/v1/health/ready && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
      - run: pnpm --filter @pedemais/web e2e
        env:
          E2E_BASE_URL: http://demo.pedemais.localhost:5173
          E2E_EMAIL: dono@demo.local
          E2E_PASSWORD: e2e-senha-forte-123
          E2E_ADMIN_EMAIL: admin@e2e.local
      - name: Backup e teste de restauração (destino local, chave descartável)
        env:
          DATABASE_OWNER_URL: postgres://pedemais_owner:owner_ci@localhost:5432/pedemais
          BACKUP_TARGET: file
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          export WORK_DIR="$RUNNER_TEMP" BACKUP_DIR="$RUNNER_TEMP/backups" AGE_IDENTITY_FILE="$RUNNER_TEMP/age.txt"
          age-keygen -o "$AGE_IDENTITY_FILE" 2>/dev/null
          infrastructure/backup/backup.sh
          infrastructure/backup/restore-test.sh
          psql "$DATABASE_OWNER_URL" -At -c "SELECT kind, status FROM backup_runs ORDER BY id" | tee runs.txt
          grep -qx 'restore_test|ok' runs.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results
            api.log
            web.log

  images:
    name: Imagens Docker (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login no GHCR (somente push na main)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-web:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backup.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-backup:sha-${{ github.sha }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,mode=max,scope=backup
      - name: WhatsApp gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/whatsapp-gateway.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}-whatsapp-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=wa
          cache-to: type=gha,mode=max,scope=wa
