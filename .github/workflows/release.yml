name: Release (imagens versionadas)

# Release automática, só na main. Quando o CI da main termina COM SUCESSO, lê a versão do
# package.json (a mesma da tela Novidades). Se a tag vX.Y.Z ainda não existe: constrói e publica
# as 4 imagens no GHCR (amd64 + arm64) e SÓ DEPOIS cria a tag e a Release no GitHub. Se a
# construção falhar, não fica tag sem imagem: o próximo push na main tenta de novo.
# Mesma versão de antes = não faz nada. Regra do projeto: toda mudança que deve virar versão sobe
# o número no package.json e em packages/shared/src/releases.ts.
# Também aceita tag vX.Y.Z criada à mão e, pelo botão "Run workflow", republicar uma tag existente.
# As imagens têm nome fixo (ghcr.io/<dono>/pedemais-*), independente do nome do repositório.
# Publicar imagem NÃO implanta nada: o deploy é o workflow "Deploy (produção)", manual, com aprovação.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para republicar as imagens (ex.: v0.7.0)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    name: Definir a versão
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
      create: ${{ steps.v.outputs.create }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # o commit que o CI aprovou
          fetch-depth: 0
      - name: Versão e tag
        id: v
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          create=false
          case "$EVENT" in
            workflow_dispatch) tag="$INPUT_TAG"; ref="$tag" ;;
            push) tag="$REF_NAME"; ref="$tag" ;;
            *)
              tag="v$(node -p "require('./package.json').version")"; ref="$SHA"
              create=true ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag inválida: $tag"; exit 1; }
          publish=true
          if [[ "$create" == true ]] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "A tag $tag já existe: versão não mudou, nada a publicar."
            publish=false
          fi
          { echo "tag=$tag"; echo "sha=$ref"; echo "publish=$publish"; echo "create=$create"; } >> "$GITHUB_OUTPUT"

  images:
    name: Imagem ${{ matrix.image }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40 # um build travado (já aconteceu) falha em vez de ocupar o runner por horas
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: infrastructure/docker/api.Dockerfile }
          - { image: web, dockerfile: infrastructure/docker/web.Dockerfile }
          - { image: whatsapp-gateway, dockerfile: infrastructure/docker/whatsapp-gateway.Dockerfile }
          - { image: backup, dockerfile: infrastructure/docker/backup.Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pedemais-${{ matrix.image }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Tag e Release no GitHub
    needs: [version, images]
    if: needs.version.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # criar a tag e a Release
    steps:
      - name: Criar a Release (cria a tag no commit aprovado)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "PedeMais $TAG" --generate-notes \
            --notes "Imagens: ghcr.io/${GITHUB_REPOSITORY_OWNER}/pedemais-{api,web,whatsapp-gateway,backup}:$TAG (amd64 e arm64). O que mudou nesta versão está na tela Novidades do sistema. Para colocar no ar: workflow Deploy (produção)."
