name: Release (imagens versionadas)

# Release automática: quando o CI da main termina COM SUCESSO, lê a versão do package.json (a
# mesma da tela Novidades). Se a tag vX.Y.Z ainda não existe, cria a tag e a Release no GitHub e
# publica as imagens com essa tag no GHCR (amd64 + arm64). Se a versão não mudou, não faz nada.
# CI vermelho na main = nenhuma Release.
# Regra do projeto: toda etapa sobe a versão no package.json e em packages/shared/src/releases.ts.
# Também roda ao criar uma tag vX.Y.Z à mão e, pelo botão "Run workflow", para republicar as
# imagens de uma tag que já existe (informe a tag).
# Publicar imagem NÃO implanta nada: o deploy é o workflow "Deploy (produção)", manual, com aprovação.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para republicar as imagens (ex.: v0.6.0)'
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version:
    name: Definir a versão
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write # criar a tag e a Release
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # o commit que o CI aprovou
          fetch-depth: 0
      - name: Versão e tag
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag inválida: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == "workflow_run" ]]; then
            # CI da main aprovado: só publica se a tag ainda não existe (versão nova).
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "A tag $tag já existe: versão não mudou, nada a publicar."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release create "$tag" --target "$SHA" --title "PedeMais $tag" --generate-notes \
              --notes "Imagens: ghcr.io/${GITHUB_REPOSITORY}-{api,web,whatsapp-gateway,backup}:$tag. O que mudou nesta versão está na tela Novidades do sistema. Para colocar no ar: workflow Deploy (produção)."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  images:
    name: Imagem ${{ matrix.image }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: infrastructure/docker/api.Dockerfile }
          - { image: web, dockerfile: infrastructure/docker/web.Dockerfile }
          - { image: whatsapp-gateway, dockerfile: infrastructure/docker/whatsapp-gateway.Dockerfile }
          - { image: backup, dockerfile: infrastructure/docker/backup.Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.image }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
