# Stack de PRODUÇÃO para Docker Swarm / Portainer.
# Pré-requisitos (ver docs/deploy.md):
#   - Traefik existente no Swarm, conectado à rede externa `network_public`.
#   - Secrets criados (lista completa em docs/deploy.md#secrets).
#   - Certificado coringa (*.dominio, exige DNS-01): acrescente -c infrastructure/swarm/wildcard.yml.
#     Sem ele, cada endereço pede o próprio certificado (HTTP-01).
#   - Super Admin: PLATFORM_ADMIN_EMAIL (+ opcional PLATFORM_ADMIN_NAME) e os secrets
#     pedemais_platform_admin_password / pedemais_platform_admin_totp. Criado só se não houver nenhum.
#   - Variáveis: PEDEMAIS_VERSION (tag imutável), PEDEMAIS_BASE_DOMAIN (comandou.com),
#     TRAEFIK_ENTRYPOINT (ex.: websecure), TRAEFIK_CERT_RESOLVER (ex.: letsencryptresolver),
#     TRAEFIK_CUSTOM_CERT_RESOLVER (HTTP-01, domínios dos clientes), BACKUP_S3_BUCKET e
#     BACKUP_S3_ENDPOINT (ex.: https://s3.us-west-004.backblazeb2.com).
# Diferenças em relação ao docker-compose.yml de desenvolvimento:
#   - `build`, `depends_on` com condição e `container_name` não existem no Swarm.
#   - Labels do Traefik ficam em `deploy.labels` (não em `labels`).
#   - Migração roda como serviço one-shot (replicas 1, restart on-failure) ANTES de atualizar a API.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pedemais_pg_password
      PEDEMAIS_OWNER_PASSWORD_FILE: /run/secrets/pedemais_owner_password
      PEDEMAIS_APP_PASSWORD_FILE: /run/secrets/pedemais_app_password
      PEDEMAIS_PLATFORM_PASSWORD_FILE: /run/secrets/pedemais_platform_password
    secrets:
      [
        pedemais_pg_password,
        pedemais_owner_password,
        pedemais_app_password,
        pedemais_platform_password,
      ]
    volumes:
      - pedemais_pgdata:/var/lib/postgresql/data
    configs:
      - source: pedemais_pg_init
        target: /docker-entrypoint-initdb.d/01-roles.sh
        mode: 0555
    networks: [pedemais_internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 1G }

  # Filas (BullMQ) e eventos em tempo real entre as réplicas da API. Só na rede interna.
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - pedemais_redisdata:/data
    networks: [pedemais_internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 256M }

  # WhatsApp por QR Code (Baileys). Uma sessão por restaurante, cifrada no volume. Só na rede interna:
  # apenas a API fala com ele, com token próprio.
  whatsapp-gateway:
    image: ghcr.io/dhqdev/pedemais-whatsapp-gateway:${PEDEMAIS_VERSION:?defina a versão}
    init: true
    environment:
      GATEWAY_TOKEN_FILE: /run/secrets/pedemais_wa_gateway_token
      SESSION_KEY_FILE: /run/secrets/pedemais_wa_session_key
      LOG_LEVEL: info
    secrets: [pedemais_wa_gateway_token, pedemais_wa_session_key]
    volumes:
      - pedemais_wadata:/data
    networks: [pedemais_internal, pedemais_egress]
    deploy:
      replicas: 1 # uma conexão por número: nunca mais de uma réplica
      placement:
        constraints: [node.role == manager] # volume local: fixe o nó
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 384M }

  # Backup diário (pg_dump cifrado com age → B2/S3) e teste semanal de restauração num Postgres
  # temporário dentro do próprio contêiner. Registra cada execução em backup_runs (painel).
  backup:
    image: ghcr.io/dhqdev/pedemais-backup:${PEDEMAIS_VERSION:?defina a versão}
    environment:
      DATABASE_OWNER_URL_FILE: /run/secrets/pedemais_db_owner_url
      AWS_ACCESS_KEY_ID_FILE: /run/secrets/pedemais_backup_s3_key_id
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/pedemais_backup_s3_secret
      AGE_IDENTITY_FILE: /run/secrets/pedemais_backup_age_identity
      S3_BUCKET: ${BACKUP_S3_BUCKET:?defina BACKUP_S3_BUCKET}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?defina BACKUP_S3_ENDPOINT}
      S3_REGION: ${BACKUP_S3_REGION:-}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-pedemais}
      BACKUP_AT: ${BACKUP_AT:-06:00} # UTC (03:00 em Brasília)
      RESTORE_TEST_AT: ${RESTORE_TEST_AT:-08:00}
      RESTORE_TEST_WEEKDAY: ${RESTORE_TEST_WEEKDAY:-7}
    secrets:
      - pedemais_db_owner_url
      - pedemais_backup_s3_key_id
      - pedemais_backup_s3_secret
      - pedemais_backup_age_identity
    networks: [pedemais_internal, pedemais_egress]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # o instalador roda o backup antes de atualizar
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 768M }

  migrate:
    image: ghcr.io/dhqdev/pedemais-api:${PEDEMAIS_VERSION:?defina a versão}
    # Migra o banco e cria o Super Admin se ainda não existir nenhum (não altera um existente).
    command:
      - sh
      - -c
      - node dist/database/migrate-cli.js && node dist/platform/platform-admin-cli.js --bootstrap
    environment:
      DATABASE_OWNER_URL_FILE: /run/secrets/pedemais_db_owner_url
      INTEGRATIONS_KEY_FILE: /run/secrets/pedemais_integrations_key
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Administrador}
      PLATFORM_ADMIN_PASSWORD_FILE: /run/secrets/pedemais_platform_admin_password
      PLATFORM_ADMIN_TOTP_SECRET_FILE: /run/secrets/pedemais_platform_admin_totp
    secrets:
      [
        pedemais_db_owner_url,
        pedemais_integrations_key,
        pedemais_platform_admin_password,
        pedemais_platform_admin_totp,
      ]
    networks: [pedemais_internal]
    deploy:
      replicas: 1
      restart_policy: { condition: on-failure, max_attempts: 5, delay: 10s }

  api:
    image: ghcr.io/dhqdev/pedemais-api:${PEDEMAIS_VERSION:?defina a versão}
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL_FILE: /run/secrets/pedemais_db_app_url
      PEDEMAIS_BASE_DOMAIN: ${PEDEMAIS_BASE_DOMAIN:-comandou.com}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'true'
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      # Chave (32 bytes base64) que cifra tokens da Focus NFe e do WhatsApp no banco.
      INTEGRATIONS_KEY_FILE: /run/secrets/pedemais_integrations_key
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:3100
      WHATSAPP_GATEWAY_TOKEN_FILE: /run/secrets/pedemais_wa_gateway_token
      # Etapa 6: painel Super Admin (admin.comandou.com), métricas e domínios dos clientes.
      PLATFORM_DATABASE_URL_FILE: /run/secrets/pedemais_db_platform_url
      METRICS_TOKEN_FILE: /run/secrets/pedemais_metrics_token
      TRAEFIK_PROVIDER_TOKEN_FILE: /run/secrets/pedemais_traefik_provider_token
      TRAEFIK_ENTRYPOINT: ${TRAEFIK_ENTRYPOINT:-websecure}
      TRAEFIK_CUSTOM_CERT_RESOLVER: ${TRAEFIK_CUSTOM_CERT_RESOLVER:-letsencrypt-http}
    secrets:
      - pedemais_db_app_url
      - pedemais_integrations_key
      - pedemais_wa_gateway_token
      - pedemais_db_platform_url
      - pedemais_metrics_token
      - pedemais_traefik_provider_token
    networks: [pedemais_internal, network_public]
    deploy:
      replicas: 2
      update_config: { parallelism: 1, order: start-first, failure_action: rollback, delay: 10s }
      rollback_config: { parallelism: 1, order: start-first }
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 512M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.pedemais-api.rule=HostRegexp(`^[a-z0-9-]+\.${PEDEMAIS_BASE_DOMAIN:-comandou.com}$$`) && PathPrefix(`/api`)
        - traefik.http.routers.pedemais-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.pedemais-api.tls=true
        - traefik.http.routers.pedemais-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.routers.pedemais-api.priority=100
        - traefik.http.services.pedemais-api.loadbalancer.server.port=3000
        - traefik.http.services.pedemais-api.loadbalancer.healthcheck.path=/api/v1/health/ready
        - traefik.http.services.pedemais-api.loadbalancer.healthcheck.interval=10s

  web:
    image: ghcr.io/dhqdev/pedemais-web:${PEDEMAIS_VERSION:?defina a versão}
    networks: [network_public]
    deploy:
      replicas: 2
      update_config: { parallelism: 1, order: start-first, failure_action: rollback }
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 128M }
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.pedemais-web.rule=HostRegexp(`^[a-z0-9-]+\.${PEDEMAIS_BASE_DOMAIN:-comandou.com}$$`)
        - traefik.http.routers.pedemais-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
        - traefik.http.routers.pedemais-web.tls=true
        - traefik.http.routers.pedemais-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencryptresolver}
        - traefik.http.routers.pedemais-web.priority=10
        - traefik.http.services.pedemais-web.loadbalancer.server.port=8080

networks:
  network_public:
    external: true # rede pública já existente do Traefik — NÃO criar outra
  pedemais_internal:
    driver: overlay
    internal: true # Postgres sem acesso externo
  pedemais_egress:
    driver: overlay # saída para a internet do gateway de WhatsApp (sem portas publicadas)

volumes:
  pedemais_pgdata:
  pedemais_redisdata:
  pedemais_wadata:

configs:
  pedemais_pg_init:
    file: ../docker/postgres-init/01-roles.sh

secrets:
  pedemais_pg_password: { external: true }
  pedemais_owner_password: { external: true }
  pedemais_app_password: { external: true }
  pedemais_db_app_url: { external: true }
  pedemais_db_owner_url: { external: true }
  pedemais_integrations_key: { external: true }
  pedemais_wa_gateway_token: { external: true }
  pedemais_wa_session_key: { external: true }
  pedemais_platform_password: { external: true }
  pedemais_db_platform_url: { external: true }
  pedemais_metrics_token: { external: true }
  pedemais_traefik_provider_token: { external: true }
  pedemais_backup_s3_key_id: { external: true }
  pedemais_backup_s3_secret: { external: true }
  pedemais_backup_age_identity: { external: true }
  pedemais_platform_admin_password: { external: true }
  pedemais_platform_admin_totp: { external: true }
