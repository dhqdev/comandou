# Stack de DESENVOLVIMENTO local. Produção usa infrastructure/swarm/comandou-stack.yml.
# Acesse: http://<slug>.comandou.localhost:8080  (*.localhost resolve para 127.0.0.1)
name: comandou

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      COMANDOU_OWNER_PASSWORD: ${COMANDOU_OWNER_PASSWORD:?defina no .env}
      COMANDOU_APP_PASSWORD: ${COMANDOU_APP_PASSWORD:?defina no .env}
      COMANDOU_PLATFORM_PASSWORD: ${COMANDOU_PLATFORM_PASSWORD:?defina no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d comandou']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    # Sem "ports": o banco não fica exposto fora da rede interna.

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    networks: [internal]

  whatsapp-gateway:
    build: { context: ., dockerfile: infrastructure/docker/whatsapp-gateway.Dockerfile }
    image: comandou-whatsapp-gateway:dev
    init: true
    profiles: [whatsapp] # opcional: docker compose --profile whatsapp up
    environment:
      GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN:-}
      SESSION_KEY: ${WHATSAPP_SESSION_KEY:-}
    volumes:
      - wadata:/data
    networks: [internal, edge]

  migrate:
    build: { context: ., dockerfile: infrastructure/docker/api.Dockerfile }
    image: comandou-api:dev
    command: ['node', 'dist/database/migrate-cli.js']
    environment:
      DATABASE_OWNER_URL: postgres://comandou_owner:${COMANDOU_OWNER_PASSWORD}@postgres:5432/comandou
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
    networks: [internal]

  api:
    image: comandou-api:dev
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://comandou_app:${COMANDOU_APP_PASSWORD}@postgres:5432/comandou
      COMANDOU_BASE_DOMAIN: ${COMANDOU_BASE_DOMAIN:-comandou.localhost}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
      # Opcional: sem ela, tokens da Focus NFe e do WhatsApp não podem ser salvos.
      INTEGRATIONS_KEY: ${INTEGRATIONS_KEY:-}
      WHATSAPP_GATEWAY_URL: ${WHATSAPP_GATEWAY_URL:-}
      WHATSAPP_GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN:-}
      # Painel Super Admin em http://admin.${COMANDOU_BASE_DOMAIN}:8080
      PLATFORM_DATABASE_URL: postgres://comandou_platform:${COMANDOU_PLATFORM_PASSWORD}@postgres:5432/comandou
      # Sem o serviço de backup aqui, restaurantes novos ficam no banco central (em produção,
      # cada um ganha o banco próprio; ver docs/adr/0011).
      TENANT_DATABASE_MODE: shared
    depends_on:
      migrate: { condition: service_completed_successfully }
    labels:
      - traefik.enable=true
      - traefik.http.routers.cm-api.rule=HostRegexp(`^[a-z0-9-]+\.${COMANDOU_BASE_DOMAIN:-comandou.localhost}$$`) && PathPrefix(`/api`)
      - traefik.http.routers.cm-api.entrypoints=web
      - traefik.http.routers.cm-api.priority=100
      - traefik.http.services.cm-api.loadbalancer.server.port=3000
    networks: [internal, edge]

  web:
    build: { context: ., dockerfile: infrastructure/docker/web.Dockerfile }
    image: comandou-web:dev
    labels:
      - traefik.enable=true
      - traefik.http.routers.cm-web.rule=HostRegexp(`^[a-z0-9-]+\.${COMANDOU_BASE_DOMAIN:-comandou.localhost}$$`)
      - traefik.http.routers.cm-web.entrypoints=web
      - traefik.http.routers.cm-web.priority=10
      - traefik.http.services.cm-web.loadbalancer.server.port=8080
    networks: [edge]

  traefik:
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=comandou_edge
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - '${HTTP_PORT:-8080}:80'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 10s
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  wadata:

networks:
  internal:
    internal: true
  edge:
    name: comandou_edge
