name: Comandou (testes, imagens e Release)

# UM workflow só, um run por push na main, nesta ordem:
#  1. Testes: Qualidade (formatação, tipos, testes) e Ponta a ponta (navegador e backup).
#  2. Versão: a do package.json (a mesma da tela Novidades) se ainda não tem tag; senão a próxima
#     correção dela (v0.8.1 → v0.8.2...). Todo push aprovado vira versão.
#  3. Imagens: as 4 imagens no GHCR (amd64 + arm64): ghcr.io/<dono>/comandou-*.
#  4. Release: só depois de tudo, cria a tag e a Release no GitHub. Se algo falhar antes, não fica
#     tag sem imagem.
# Mudança só de documentação não roda nada. Versão nova de funcionalidade (0.9.0...): suba o número
# no package.json e em packages/shared/src/releases.ts. Pelo botão "Run workflow" dá para
# republicar as imagens de uma tag existente (sem rodar os testes).
# Publicar NÃO implanta nada: o deploy é o workflow "Deploy (produção)", manual, com aprovação.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para republicar as imagens (ex.: v0.8.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: comandou-${{ github.ref }}
  cancel-in-progress: true # um push novo cancela o anterior (a tag só nasce no fim)

jobs:
  check:
    name: 1. Qualidade (formatação, tipos e testes)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Com Redis, os testes da nota fiscal e do WhatsApp passam pela fila real (BullMQ).
      TEST_REDIS_URL: redis://localhost:6379
      TEST_DATABASE_OWNER_URL: postgres://comandou_owner:owner_ci@localhost:5432/comandou_test
      TEST_DATABASE_URL: postgres://comandou_app:app_ci@localhost:5432/comandou_test
      TEST_DATABASE_PLATFORM_URL: postgres://comandou_platform:platform_ci@localhost:5432/comandou_test
      TEST_DATABASE_DEDICATED_OWNER_URL: postgres://comandou_owner:owner_ci@localhost:5432/comandou_dedicado_test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o pnpm
        uses: pnpm/action-setup@v4
      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Papéis do banco de teste
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE comandou_owner LOGIN PASSWORD 'owner_ci'" \
            -c "CREATE ROLE comandou_app LOGIN PASSWORD 'app_ci' NOBYPASSRLS" \
            -c "CREATE ROLE comandou_platform LOGIN PASSWORD 'platform_ci' NOBYPASSRLS" \
            -c "CREATE DATABASE comandou_test OWNER comandou_owner" \
            -c "CREATE DATABASE comandou_dedicado_test OWNER comandou_owner"
      - name: Formatação (Prettier)
        run: pnpm format:check
      - name: Scripts de shell
        run: shellcheck -x -S warning infrastructure/backup/*.sh scripts/*.sh
      - name: Alertas do Prometheus
        working-directory: infrastructure/monitoring
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.2 check rules alerts.yml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v2.53.2 test rules alerts.test.yml
      - name: Compilar o pacote compartilhado
        run: pnpm --filter @comandou/shared build
      - name: Checagem de tipos (TypeScript)
        run: pnpm typecheck
      - name: Testes da API e do Web (Vitest)
        run: pnpm test
      - name: Testes do agente de impressão
        run: node --test tools/print-agent/escpos.test.mjs
      - name: Build de produção
        run: pnpm build
      - name: Auditoria de dependências (alta/crítica)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: 1. Ponta a ponta (navegador e backup)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: check
    env:
      # Valores só de teste (banco descartável do CI), nunca usados em produção.
      E2E_INTEGRATIONS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      E2E_ADMIN_PASSWORD: e2e-super-admin-123
      E2E_ADMIN_TOTP: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Instalar o pnpm
        uses: pnpm/action-setup@v4
      - name: Instalar o Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar o navegador do Playwright
        run: pnpm --filter @comandou/web exec playwright install --with-deps chromium
      - name: Banco, migrações e tenant de teste
        env:
          PGPASSWORD: postgres
          DATABASE_OWNER_URL: postgres://comandou_owner:owner_ci@localhost:5432/comandou
          PROVISION_ADMIN_PASSWORD: e2e-senha-forte-123
          E2E_INTEGRATIONS_KEY: ${{ env.E2E_INTEGRATIONS_KEY }}
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD }}
          E2E_ADMIN_TOTP: ${{ env.E2E_ADMIN_TOTP }}
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE comandou_owner LOGIN PASSWORD 'owner_ci'" \
            -c "CREATE ROLE comandou_app LOGIN PASSWORD 'app_ci' NOBYPASSRLS" \
            -c "CREATE ROLE comandou_platform LOGIN PASSWORD 'platform_ci' NOBYPASSRLS" \
            -c "CREATE DATABASE comandou OWNER comandou_owner"
          pnpm --filter @comandou/shared build
          pnpm --filter @comandou/api build
          pnpm --filter @comandou/api db:migrate
          pnpm --filter @comandou/api tenant:provision demo "Restaurante Demo" dono@demo.local "Dono Demo"
          # Super Admin de teste com segredo TOTP fixo (o teste do navegador gera o código).
          DATABASE_OWNER_URL=$DATABASE_OWNER_URL INTEGRATIONS_KEY=$E2E_INTEGRATIONS_KEY \
            PLATFORM_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD PLATFORM_ADMIN_TOTP_SECRET=$E2E_ADMIN_TOTP \
            node apps/api/dist/platform/platform-admin-cli.js admin@e2e.local "Admin E2E"
      - name: Subir API e Web
        run: |
          DATABASE_URL=postgres://comandou_app:app_ci@localhost:5432/comandou AUTH_LOGIN_RATE_LIMIT=100 \
            PLATFORM_DATABASE_URL=postgres://comandou_platform:platform_ci@localhost:5432/comandou \
            INTEGRATIONS_KEY=$E2E_INTEGRATIONS_KEY \
            nohup node apps/api/dist/main.js > api.log 2>&1 &
          nohup pnpm --filter @comandou/web exec vite --port 5173 > web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/v1/health/ready && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173/ >/dev/null && break; sleep 1; done
      - name: Testes de ponta a ponta no navegador
        run: pnpm --filter @comandou/web e2e
        env:
          E2E_BASE_URL: http://demo.comandou.localhost:5173
          E2E_EMAIL: dono@demo.local
          E2E_PASSWORD: e2e-senha-forte-123
          E2E_ADMIN_EMAIL: admin@e2e.local
      - name: Backup e teste de restauração (destino local, chave descartável)
        env:
          DATABASE_OWNER_URL: postgres://comandou_owner:owner_ci@localhost:5432/comandou
          BACKUP_TARGET: file
          PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          export WORK_DIR="$RUNNER_TEMP" BACKUP_DIR="$RUNNER_TEMP/backups" AGE_IDENTITY_FILE="$RUNNER_TEMP/age.txt"
          age-keygen -o "$AGE_IDENTITY_FILE" 2>/dev/null
          infrastructure/backup/backup.sh
          infrastructure/backup/restore-test.sh
          psql "$DATABASE_OWNER_URL" -At -c "SELECT kind, status FROM backup_runs ORDER BY id" | tee runs.txt
          grep -qx 'restore_test|ok' runs.txt
      - name: Guardar prints e logs (só se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            apps/web/test-results
            api.log
            web.log

  version:
    name: 2. Definir a versão
    needs: [check, e2e]
    # Roda se os testes passaram (ou foram pulados, no republicar por tag); nunca se algum falhou.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      sha: ${{ steps.v.outputs.sha }}
      create: ${{ steps.v.outputs.create }}
    steps:
      - name: Baixar o código aprovado nos testes
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # traz as tags
      - name: Calcular a próxima versão
        id: v
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"; ref="$tag"; create=false
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag inválida: $tag"; exit 1; }
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || { echo "a tag $tag não existe"; exit 1; }
          else
            ref="$SHA"; create=true
            base="$(node -p "require('./package.json').version")"
            if ! git rev-parse -q --verify "refs/tags/v$base" >/dev/null; then
              tag="v$base"
            else
              # Já existe: próxima correção da mesma linha (maior patch publicado + 1).
              mm="${base%.*}"
              last="$(git tag -l "v$mm.*" | sed "s/^v$mm\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)"
              tag="v$mm.$((last + 1))"
            fi
          fi
          echo "versão: $tag (commit $ref)"
          { echo "tag=$tag"; echo "sha=$ref"; echo "create=$create"; } >> "$GITHUB_OUTPUT"

  images:
    name: 3. Imagem ${{ matrix.image }} (amd64 + arm64)
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 40 # um build travado falha em vez de ocupar o runner por horas
    strategy:
      matrix:
        include:
          - { image: api, dockerfile: infrastructure/docker/api.Dockerfile }
          - { image: web, dockerfile: infrastructure/docker/web.Dockerfile }
          - { image: whatsapp-gateway, dockerfile: infrastructure/docker/whatsapp-gateway.Dockerfile }
          - { image: backup, dockerfile: infrastructure/docker/backup.Dockerfile }
    steps:
      - name: Baixar o código da versão
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Preparar emulação arm64 (QEMU)
        uses: docker/setup-qemu-action@v3
      - name: Preparar o Buildx
        uses: docker/setup-buildx-action@v3
      - name: Entrar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e publicar ghcr.io/${{ github.repository_owner }}/comandou-${{ matrix.image }}:${{ needs.version.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comandou-${{ matrix.image }}:${{ needs.version.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: 4. Criar a tag e a Release
    needs: [version, images]
    if: needs.version.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Criar a tag ${{ needs.version.outputs.tag }} e a Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Comandou $TAG" --generate-notes \
            --notes "Imagens: ghcr.io/${GITHUB_REPOSITORY_OWNER}/comandou-{api,web,whatsapp-gateway,backup}:$TAG (amd64 e arm64). O que mudou está na tela Novidades do sistema. Para colocar no ar: workflow Deploy (produção) ou scripts/get.sh."
