# Igual a security-headers.conf, mas o cardápio (/pedir) pode ser exibido em moldura pelo PRÓPRIO
# site: é a prévia do celular na tela "Loja online". Outros sites continuam bloqueados.
# Repetido em cada location com add_header (Nginx não herda add_header quando a location define o seu).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 'wasm-unsafe-eval', worker blob: e connect blob: são do item em 3D do cardápio (model-viewer: o
# descompactador de malhas é WebAssembly num worker e as texturas do modelo vêm por blob:).
# assets.pagseguro.com.br: SDK do PagBank que cifra o cartão no celular (pagamento pelo app).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://assets.pagseguro.com.br; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: wss: https://viacep.com.br https://brasilapi.com.br; media-src 'self' blob: data:; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
