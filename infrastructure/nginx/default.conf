# Nginx: serve SOMENTE os arquivos estáticos do React. A API (/api) é roteada pelo Traefik
# diretamente para o NestJS; nada de dados de restaurante passa ou é cacheado aqui.
# Robôs que montam a prévia do link (WhatsApp, Instagram/Facebook, Telegram, iMessage, X...). Eles
# não rodam JavaScript, então no cardápio vão para uma página da API com o nome, o texto e a logo
# da loja, e não com as do Comandou. Buscadores (Google) não entram: leem o cardápio normal.
map $http_user_agent $cm_link_preview {
  default 0;
  "~*(facebookexternalhit|facebookcatalog|Facebot|WhatsApp|Twitterbot|TelegramBot|Slackbot|Discordbot|LinkedInBot|Pinterest|SkypeUriPreview|redditbot|vkShare|Iframely|Embedly|Viber|Snapchat|Google-PageRenderer)" 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Health check do contêiner (não toca disco nem API).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Instalação em um comando: curl -fsSL https://admin.<domínio>/instalar | sudo bash
  location = /instalar {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/plain;
    types { }
    alias /opt/comandou-instalador/scripts/get.sh;
  }

  # Assets com hash no nome: cache longo e imutável.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Manifest do PWA com MIME correto (nem toda versão do mime.types inclui .webmanifest).
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    types { }
    try_files $uri =404;
  }

  # Service worker: sempre revalidar para atualizações chegarem.
  location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Defesa em profundidade: se /api chegar aqui por engano de roteamento, não servir o SPA.
  location /api/ {
    return 502;
  }

  # Link público de rastreio: o token no caminho funciona como senha, então não vai para o log.
  location /rastreio/ {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Acompanhamento do pedido do cliente (cardápio online): mesmo cuidado do rastreio.
  location /pedido/ {
    access_log off;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # Cardápio online: aceita moldura do próprio site (prévia do celular em "Loja online").
  location /pedir {
    absolute_redirect off;
    if ($cm_link_preview) {
      return 302 /api/v1/store/preview?p=$uri;
    }
    include /etc/nginx/snippets/security-headers-frame-self.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  # SPA: rotas do React caem no index.html, que nunca é cacheado.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
