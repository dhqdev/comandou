# Nginx: serve SOMENTE os arquivos estáticos do React. A API (/api) é roteada pelo Traefik
# diretamente para o NestJS; nada de dados de restaurante passa ou é cacheado aqui.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

  # Health check do contêiner (não toca disco nem API).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Assets com hash no nome: cache longo e imutável.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Manifest do PWA com MIME correto (nem toda versão do mime.types inclui .webmanifest).
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    types { }
    try_files $uri =404;
  }

  # Service worker: sempre revalidar para atualizações chegarem.
  location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Defesa em profundidade: se /api chegar aqui por engano de roteamento, não servir o SPA.
  location /api/ {
    return 502;
  }

  # SPA: rotas do React caem no index.html, que nunca é cacheado.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
