# Gerador de 3D por foto na nossa própria VM (opcional). Acrescente ao deploy:
#   docker build -t comandou-model3d-ai:local infrastructure/model3d-ai
#   docker stack deploy -c infrastructure/swarm/comandou-stack.yml \
#     -c infrastructure/swarm/model3d-ai.yml comandou
# Precisa de ~8 GB de memória livre na hora de gerar (sem placa de vídeo, 30 s a 3 min por foto).
# Sem ele, "criar pelas fotos" usa o Meshy se houver MESHY_API_KEY, ou fica desligado.
version: '3.8'

services:
  model3d-ai:
    image: comandou-model3d-ai:local
    init: true
    environment:
      MODEL3D_RESOLUTION: '256'
    networks: [comandou_internal]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager] # imagem construída no próprio servidor
      restart_policy: { condition: on-failure }
      resources:
        limits: { memory: 8G }

  api:
    environment:
      MODEL3D_LOCAL_URL: http://model3d-ai:8000

  model3d:
    environment:
      MODEL3D_LOCAL_URL: http://model3d-ai:8000
